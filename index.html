<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>SKYLARIA Premium Membership</title>

  <meta name="description" content="SKYLARIA premium memberships, beta access, custom creature packs, and premium skin changes for Minecraft Bedrock." />
  <meta name="theme-color" content="#08111f">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, sans-serif;
      background: #08111f;
      color: #f4f7fb;
      line-height: 1.6;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    .page {
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(70, 130, 255, 0.30), transparent 32%),
        radial-gradient(circle at top right, rgba(113, 68, 255, 0.25), transparent 30%),
        linear-gradient(180deg, #08111f 0%, #101a2e 50%, #070b14 100%);
    }

    .container {
      width: min(1140px, 92%);
      margin: 0 auto;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 1000;

      backdrop-filter: blur(14px);
      background: rgba(8, 17, 31, 0.72);

      padding: 22px 0;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    /* ✅ NEW LOGO STYLE */
    .logo-img {
      width: 42px;
      height: 42px;
      object-fit: contain;
      border-radius: 12px;
      box-shadow: 0 0 25px rgba(82, 168, 255, 0.25);
    }

    nav {
      display: flex;
      gap: 22px;
      color: #cbd7ea;
      font-size: 14px;
    }

    nav a:hover {
      color: white;
    }

    .hero {
      padding: 80px 0 60px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 42px;
      align-items: center;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;

      padding: 8px 14px;

      border-radius: 999px;

      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.14);

      margin-bottom: 20px;

      color: #d9e7ff;
      font-size: 14px;
    }

    h1 {
      font-size: clamp(36px, 7vw, 78px);
      line-height: 0.95;
      letter-spacing: -2px;
      margin-bottom: 24px;
    }

    .gradient-text {
      background: linear-gradient(135deg, #69bcff, #b99cff, #ffffff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero p {
      color: #cbd7ea;
      font-size: 18px;
      margin-bottom: 28px;
      max-width: 620px;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
    }

    .btn {
      min-height: 50px;
      padding: 0 24px;

      border-radius: 14px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      font-weight: 800;

      transition: 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn-primary {
      background: linear-gradient(135deg, #49a8ff, #7c3aed);
      color: white;
      box-shadow: 0 16px 40px rgba(73, 168, 255, 0.25);
    }

    .btn-secondary {
      border: 1px solid rgba(255,255,255,0.16);
      background: rgba(255,255,255,0.06);
      color: #eaf2ff;
    }

    .hero-image {
      width: 100%;
      height: 380px;
      object-fit: cover;
      border-radius: 22px;
      border: 1px solid rgba(255,255,255,0.12);
    }

    section {
      padding: 70px 0;
    }

    .section-title {
      text-align: center;
      margin-bottom: 38px;
    }

    .section-title h2 {
      font-size: clamp(30px, 4vw, 46px);
      margin-bottom: 12px;
    }

    .section-title p {
      color: #aebbd1;
      max-width: 760px;
      margin: 0 auto;
    }

    .grid {
      display: grid;
      gap: 22px;
    }

    .plans {
      grid-template-columns: repeat(3, 1fr);
    }

    .plan-card {
      border-radius: 24px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.055);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .highlight {
      border-color: rgba(105, 188, 255, 0.4);
      background: linear-gradient(180deg, rgba(82,168,255,0.15), rgba(255,255,255,0.05));
    }

    .plan-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .plan-top h3 {
      font-size: 22px;
    }

    .plan-tag {
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(105,188,255,0.12);
      color: #cfe7ff;
      font-size: 12px;
      font-weight: 800;
    }

    .plan-image {
      width: 100%;
      height: 160px;
      object-fit: cover;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.12);
    }

    .price {
      font-size: 42px;
      font-weight: 900;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .price span {
      font-size: 16px;
      color: #c4d2ea;
    }

    .old-price {
      text-decoration: line-through;
      opacity: 0.7;
      font-size: 18px;
    }

    .feature-list {
      list-style: none;
    }

    .feature-list li {
      margin-bottom: 10px;
    }

    .feature-list li::before {
      content: "✓";
      color: #69bcff;
      margin-right: 10px;
    }

    .cta-box {
      border-radius: 30px;
      border: 1px solid rgba(255,255,255,0.14);
      background: linear-gradient(135deg, rgba(73,168,255,0.18), rgba(124,58,237,0.18));
      padding: 42px;
      text-align: center;
    }

    footer {
      padding: 34px 0;
      border-top: 1px solid rgba(255,255,255,0.08);
      color: #8f9db4;
      font-size: 13px;
    }

    .footer-grid {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 18px;
    }

    @media (max-width: 980px) {
      .hero,
      .plans {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 620px) {
      nav {
        display: none;
      }
    }
  </style>
</head>

<body>

<div class="page">

  <header class="container">

    <a href="#" class="logo">

      <!-- ✅ YOUR NEW LOGO -->
      <img src="logo.png" alt="SKYLARIA Logo" class="logo-img">

      <span>SKYLARIA</span>

    </a>

    <nav>
      <a href="#plans">Plans</a>
      <a href="#join">Join</a>
      <a href="#support">Support</a>
    </nav>

  </header>

  <!-- (rest of your code stays EXACTLY the same) -->

</div>

</body>
</html>
